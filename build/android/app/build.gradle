plugins {
    id 'com.android.application'
}

// Package only the ABIs that have a libwails.so. The Go library is built for
// arm64-v8a by default; x86_64 only exists after the amd64 build (Taskfile
// package:fat / ARCH=amd64). youtubedl-android also ships x86_64 native libs,
// so without this filter an x86_64 emulator picks that ABI, finds no
// libwails.so, and crashes with UnsatisfiedLinkError. x86_64 emulators run the
// arm64-only APK through ARM translation.
def wails_abis = ['arm64-v8a', 'x86_64'].findAll {
    file("src/main/jniLibs/${it}/libwails.so").exists()
}
if (wails_abis.isEmpty()) {
    wails_abis = ['arm64-v8a']
}

android {
    namespace 'com.wails.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.jeetraj.tdrive"
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "1")
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.0"

        // Only ABIs that carry libwails.so (see wails_abis above)
        ndk {
            abiFilters(*wails_abis)
        }
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()
    if (System.getenv("ANDROID_REQUIRE_RELEASE_SIGNING") == "true" && !hasKeystore) {
        throw new GradleException("Android release signing is required but ANDROID_KEYSTORE_FILE is unset")
    }
    if (hasKeystore && ["ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"].any {
        !System.getenv(it)?.trim()
    }) {
        throw new GradleException("Android release signing credentials are incomplete")
    }

    signingConfigs {
        // A real keystore can be provided via environment variables; without
        // one, release builds are signed with the debug keystore so they can
        // be installed for testing (not suitable for Play Store uploads).
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        jniLibs {
            // youtubedl-android loads libpython.zip.so by path during first-use init.
            // Extract native libraries so the bundled Python runtime can find it.
            useLegacyPackaging true
        }
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // yt-dlp and ffmpeg for the link downloader. Pinned to the latest Maven Central release as of 2026-10-24 (0.18.1, published 2025-11-16).
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
