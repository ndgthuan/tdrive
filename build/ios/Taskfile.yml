version: '3'

includes:
  common: ../Taskfile.yml

# Platform selection:
#   task ios:package                          -> simulator bundle (ad-hoc signed)
#   task ios:package IOS_PLATFORM=device CODESIGN_IDENTITY="Apple Development: ..." \
#        [PROVISIONING_PROFILE=path.mobileprovision]
#                                             -> device bundle (real signing)
#   task ios:package:ipa IOS_PLATFORM=device ... -> .ipa for distribution/install
# For automatically managed signing & provisioning, use `task ios:xcode` and
# build from the generated Xcode project instead.
vars:
  APP_VERSION:
    # Includes are loaded for every platform, so even this iOS-only variable
    # must be readable on Linux and Windows runners.
    sh: |
      awk '/<key>CFBundleShortVersionString<\/key>/ {
        if (getline <= 0 || $0 !~ /<string>[^<]+<\/string>/) exit 1
        gsub(/.*<string>|<\/string>.*/, "")
        print
        found = 1
        exit
      }
      END { if (!found) exit 1 }' build/ios/Info.plist
  # Override for every subsequent TestFlight upload, for example
  # IOS_BUILD_NUMBER=2. Apple rejects duplicate bundle build numbers.
  IOS_BUILD_NUMBER: '{{.IOS_BUILD_NUMBER | default .APP_VERSION}}'
  BUNDLE_ID: '{{.BUNDLE_ID | default "com.wails.app"}}'
  IOS_PLATFORM: '{{.IOS_PLATFORM | default "simulator"}}'
  MIN_IOS_VERSION: '{{.MIN_IOS_VERSION | default "15.0"}}'
  IOS_SDK: '{{if eq .IOS_PLATFORM "device"}}iphoneos{{else}}iphonesimulator{{end}}'
  IOS_TARGET: 'arm64-apple-ios{{.MIN_IOS_VERSION}}{{if ne .IOS_PLATFORM "device"}}-simulator{{end}}'
  IOS_VERSION_MIN_FLAG: '{{if eq .IOS_PLATFORM "device"}}-miphoneos-version-min={{.MIN_IOS_VERSION}}{{else}}-mios-simulator-version-min={{.MIN_IOS_VERSION}}{{end}}'
  # "-" is ad-hoc signing: fine for the simulator, rejected by real devices.
  CODESIGN_IDENTITY: '{{.CODESIGN_IDENTITY | default "-"}}'
  # Optional path to a .mobileprovision embedded into device bundles
  PROVISIONING_PROFILE: '{{.PROVISIONING_PROFILE | default ""}}'
  # SDK_PATH is computed lazily at task-level to avoid errors on non-macOS systems

tasks:
  install:deps:
    summary: Check and install iOS development dependencies
    cmds:
      - go run build/ios/scripts/deps/install_deps.go
    env:
      TASK_FORCE_YES: '{{if .YES}}true{{else}}false{{end}}'
    prompt: This will check and install iOS development dependencies. Continue?

  # Note: Bindings generation may show CGO warnings for iOS C imports.
  # These warnings are harmless and don't affect the generated bindings,
  # as the generator only needs to parse Go types, not C implementations.
  build:
    summary: Creates a build of the application for iOS
    deps:
      - task: generate:ios:overlay
      - task: generate:ios:xcode
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
    cmds:
      - echo "Building iOS app {{.APP_NAME}} ({{.IOS_PLATFORM}})..."
      - go build -buildmode=c-archive -overlay build/ios/xcode/overlay.json {{.BUILD_FLAGS}} -o {{.OUTPUT}}.a
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production,ios -trimpath -buildvcs=false -ldflags="-w -s -X main.appVersion={{.APP_VERSION}}"{{else}}-tags ios,debug -buildvcs=false -gcflags=all="-l"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      SDK_PATH:
        sh: xcrun --sdk {{.IOS_SDK}} --show-sdk-path
    env:
      GOOS: ios
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default "arm64"}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'
      CGO_CFLAGS: '-isysroot {{.SDK_PATH}} -target {{.IOS_TARGET}} {{.IOS_VERSION_MIN_FLAG}}'
      CGO_LDFLAGS: '-isysroot {{.SDK_PATH}} -target {{.IOS_TARGET}}'

  # The link downloader's engine: a pinned embedded CPython (BeeWare Python-Apple-support)
  # plus the pinned yt-dlp wheel. Downloads are checked against their published SHA-256
  # before anything is unpacked. Shared stdlib and architecture-specific modules
  # are merged by package_runtime.py, which also embeds extension frameworks.
  mediadl:fetch:
    internal: true
    summary: Download and verify the pinned Python runtime and yt-dlp for the link downloader
    vars:
      MEDIADL_CACHE: build/ios/mediadl/cache
      PY_SUPPORT_VERSION: 3.13-b16
      PY_SUPPORT_URL: https://github.com/beeware/Python-Apple-support/releases/download/3.13-b16/Python-3.13-iOS-support.b16.tar.gz
      PY_SUPPORT_SHA256: 22b96f3d0c3663225f078556b036d2ee6ce3ff98c885706585240681335c71ea
      CERTIFI_URL: https://files.pythonhosted.org/packages/32/d1/a3652fe2c19134d0d15922177821d863cbd7e842d53a21bbe7e8e3a1b5ac/certifi-2026.10.23-py3-none-any.whl
      CERTIFI_SHA256: e9b54de76e530bb6cf0ccd036787103acb58fd42ba930ea8bf948ddbaa2f61d1
      YT_DLP_VERSION: 2026.10.21
      YT_DLP_URL: https://files.pythonhosted.org/packages/b7/75/ae700ddc7e0b1095fd06cf7e251627dcf4cafcaff460cce92cdc08023b13/yt_dlp-2026.10.21-py3-none-any.whl
      YT_DLP_SHA256: 94a3a3e2c423129d0bbd2f1be000c4171fa1226c29e251c84aff868f2851c247
    sources:
      - build/ios/mediadl/tdrive_mediadl.py
    generates:
      - "{{.MEDIADL_CACHE}}/py/Python.xcframework/Info.plist"
      - "{{.MEDIADL_CACHE}}/yt_dlp.whl"
      - "{{.MEDIADL_CACHE}}/certifi.whl"
    cmds:
      - |
        set -eu
        mkdir -p "{{.MEDIADL_CACHE}}"
        cd "{{.MEDIADL_CACHE}}"
        if [ ! -f py-support.tar.gz ]; then curl -fsSL -o py-support.tar.gz "{{.PY_SUPPORT_URL}}"; fi
        echo "{{.PY_SUPPORT_SHA256}}  py-support.tar.gz" | shasum -a 256 -c -
        rm -rf py && mkdir py && tar -xzf py-support.tar.gz -C py
        if ! echo "{{.YT_DLP_SHA256}}  yt_dlp.whl" | shasum -a 256 -c - >/dev/null 2>&1; then curl -fsSL -o yt_dlp.whl "{{.YT_DLP_URL}}"; fi
        echo "{{.YT_DLP_SHA256}}  yt_dlp.whl" | shasum -a 256 -c -
        if [ ! -f certifi.whl ]; then curl -fsSL -o certifi.whl "{{.CERTIFI_URL}}"; fi
        echo "{{.CERTIFI_SHA256}}  certifi.whl" | shasum -a 256 -c -
        echo "fetched yt-dlp {{.YT_DLP_VERSION}} and Python {{.PY_SUPPORT_VERSION}}"

  # Copies the runtime into the built .app so yt-dlp is found at launch. Run after
  # create:app:bundle. Xcode uses the same packager in build_xcode_archive.sh.
  mediadl:stage:
    internal: true
    summary: Copy the embedded Python runtime and yt-dlp into the app bundle
    vars:
      MEDIADL_CACHE: build/ios/mediadl/cache
      MEDIADL_APP: '{{.MEDIADL_APP | default (printf "%s/%s.app" .BIN_DIR .APP_NAME)}}'
    deps:
      - task: mediadl:fetch
    cmds:
      - |
        set -eu
        APP="{{.MEDIADL_APP}}"
        python3 build/ios/mediadl/package_runtime.py \
          --source "{{.MEDIADL_CACHE}}/py/Python.xcframework" \
          --wheel "{{.MEDIADL_CACHE}}/yt_dlp.whl" \
          --certifi "{{.MEDIADL_CACHE}}/certifi.whl" \
          --app "$APP" --platform "{{.IOS_PLATFORM}}" --arch "{{.ARCH | default "arm64"}}" \
          --sign "{{.CODESIGN_IDENTITY}}"
        codesign --force --sign "{{.CODESIGN_IDENTITY}}" --timestamp=none --preserve-metadata=identifier,entitlements,flags "$APP"
        echo "staged the link downloader runtime into $APP"

  package:
    summary: Packages a production build of the application into a `.app` bundle
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - task: compile:ios:link
      - task: create:app:bundle
      - task: mediadl:stage

  package:ipa:
    summary: Packages a production build into an .ipa (requires IOS_PLATFORM=device and a real CODESIGN_IDENTITY)
    deps:
      - task: package
    cmds:
      - rm -rf "{{.BIN_DIR}}/Payload" "{{.BIN_DIR}}/{{.APP_NAME}}.ipa"
      - mkdir -p "{{.BIN_DIR}}/Payload"
      - cp -R "{{.BIN_DIR}}/{{.APP_NAME}}.app" "{{.BIN_DIR}}/Payload/"
      - cd "{{.BIN_DIR}}" && zip -qry "{{.APP_NAME}}.ipa" Payload
      - rm -rf "{{.BIN_DIR}}/Payload"
      - echo "Created {{.BIN_DIR}}/{{.APP_NAME}}.ipa"

  # Link the Go c-archive with main.m into the final executable.
  # Used by both the dev `run` flow and `package`.
  compile:ios:link:
    internal: true
    summary: Link the iOS executable from the Go archive and main.m
    deps:
      - task: mediadl:fetch
    vars:
      SDK_PATH:
        sh: xcrun --sdk {{.IOS_SDK}} --show-sdk-path
    cmds:
      - |
        # The project's own bootstrap wins over the generated one. `wails3 ios
        # xcode:gen` rewrites build/ios/xcode/main/main.m from its template on
        # every build, so anything this app needs at launch has to live in the
        # copy the repo owns or it silently disappears on the next run.
        MAIN_M=build/ios/main.m
        if [ ! -f "$MAIN_M" ]; then
          MAIN_M=build/ios/xcode/main/main.m
        fi
        xcrun -sdk {{.IOS_SDK}} clang \
          -fobjc-arc -fblocks -DTDRIVE_REQUIRE_PYTHON=1 \
          -F"build/ios/mediadl/cache/py/Python.xcframework/{{if eq .IOS_PLATFORM "device"}}ios-arm64{{else}}ios-arm64_x86_64-simulator{{end}}" \
          -framework Python -Wl,-rpath,@executable_path/Frameworks \
          -target {{.IOS_TARGET}} \
          -isysroot {{.SDK_PATH}} \
          -framework Foundation -framework UIKit -framework WebKit \
          -framework Security -framework CoreFoundation \
          -framework CoreGraphics -framework ImageIO \
          -framework Photos -framework PhotosUI -framework Network \
          -framework UniformTypeIdentifiers \
          -framework LocalAuthentication -framework UserNotifications \
          -framework AVFoundation -framework CoreMedia \
          -framework CoreLocation -framework CoreMotion -framework SystemConfiguration \
          -lresolv \
          -o "{{.BIN_DIR}}/{{.APP_NAME | lower}}" \
          "$MAIN_M" -Wl,-force_load,"{{.BIN_DIR}}/{{.APP_NAME}}.a"

  create:app:bundle:
    summary: Creates an iOS `.app` bundle
    vars:
      # Includes share top-level defaults, so keep the iOS default out of macOS signing.
      ENTITLEMENTS_FILE: '{{.ENTITLEMENTS_FILE | default "build/ios/entitlements.plist"}}'
    cmds:
      - rm -rf "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - cp "{{.BIN_DIR}}/{{.APP_NAME | lower}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/"
      - cp build/ios/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/"
      - |
        # Embed the provisioning profile for device builds when provided
        if [ "{{.IOS_PLATFORM}}" = "device" ] && [ -n "{{.PROVISIONING_PROFILE}}" ]; then
          cp "{{.PROVISIONING_PROFILE}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/embedded.mobileprovision"
        fi
      - |
        # Compile asset catalog and embed icons in the app bundle
        APP_BUNDLE="{{.BIN_DIR}}/{{.APP_NAME}}.app"
        AC_IN="build/ios/xcode/main/Assets.xcassets"
        if [ -d "$AC_IN" ]; then
          TMP_AC=$(mktemp -d)
          xcrun actool \
            --compile "$TMP_AC" \
            --app-icon AppIcon \
            --platform {{.IOS_SDK}} \
            --minimum-deployment-target {{.MIN_IOS_VERSION}} \
            --product-type com.apple.product-type.application \
            --target-device iphone \
            --target-device ipad \
            --output-partial-info-plist "$APP_BUNDLE/assetcatalog_generated_info.plist" \
            "$AC_IN"
          if [ -f "$TMP_AC/Assets.car" ]; then
            cp -f "$TMP_AC/Assets.car" "$APP_BUNDLE/Assets.car"
          fi
          rm -rf "$TMP_AC"
          if [ -f "$APP_BUNDLE/assetcatalog_generated_info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Merge $APP_BUNDLE/assetcatalog_generated_info.plist" "$APP_BUNDLE/Info.plist" || true
          fi
        fi
      - |
        # Sign the bundle. Ad-hoc ("-") works on the simulator only; device
        # builds need a real identity (and usually entitlements + profile).
        # Entitlements are only applied to device builds - simulator bundles
        # must not carry them (SpringBoard refuses to launch the app).
        if [ "{{.IOS_PLATFORM}}" = "device" ] && [ -f "{{.ENTITLEMENTS_FILE}}" ]; then
          codesign --force --sign "{{.CODESIGN_IDENTITY}}" --entitlements "{{.ENTITLEMENTS_FILE}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app"
        else
          codesign --force --sign "{{.CODESIGN_IDENTITY}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app"
        fi

  deploy-simulator:
    summary: Deploy to iOS Simulator
    deps: [package]
    cmds:
      - |
        # Read the real bundle id from the built bundle (it comes from
        # build/config.yml, not the BUNDLE_ID var, so it varies per project).
        APP="{{.BIN_DIR}}/{{.APP_NAME}}.app"
        BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
        xcrun simctl terminate booted "$BUNDLE_ID" 2>/dev/null || true
        # Install over the existing app rather than uninstalling first.
        # simctl uninstall deletes the whole data container, which on this app
        # means the Telegram session, the config and the SQLite projection --
        # so every dev run used to land on the login screen and cost a fresh
        # sign-in. Installing over keeps the container and still replaces the
        # binary and the web assets.
        #
        # Set IOS_CLEAN=1 when you actually want a first-run state.
        if [ "${IOS_CLEAN:-0}" = "1" ]; then
          echo "IOS_CLEAN=1: wiping the app container (session, config, database)"
          xcrun simctl uninstall booted "$BUNDLE_ID" 2>/dev/null || true
        fi
        xcrun simctl install booted "$APP"
        xcrun simctl launch booted "$BUNDLE_ID"

  deploy-device:
    summary: Install and launch on a connected device (requires IOS_PLATFORM=device build and real signing)
    cmds:
      - |
        DEVICE="{{.DEVICE_ID}}"
        if [ -z "$DEVICE" ]; then
          DEVICE=$(xcrun devicectl list devices --hide-headers 2>/dev/null | awk 'NR==1 {print $3}')
        fi
        if [ -z "$DEVICE" ]; then
          echo "No connected device found. Pass DEVICE_ID=<identifier> (see: xcrun devicectl list devices)"
          exit 1
        fi
        xcrun devicectl device install app --device "$DEVICE" "{{.BIN_DIR}}/{{.APP_NAME}}.app"
        BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "{{.BIN_DIR}}/{{.APP_NAME}}.app/Info.plist")
        xcrun devicectl device process launch --device "$DEVICE" "$BUNDLE_ID"

  compile:ios:
    summary: Compile the iOS executable from Go archive and main.m
    deps:
      - task: build
    cmds:
      - task: compile:ios:link

  generate:ios:bindings:
    internal: true
    summary: Generates bindings for iOS with proper CGO flags
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    vars:
      SDK_PATH:
        sh: xcrun --sdk {{.IOS_SDK}} --show-sdk-path
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true
    env:
      GOOS: ios
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default "arm64"}}'
      CGO_CFLAGS: '-isysroot {{.SDK_PATH}} -target {{.IOS_TARGET}} {{.IOS_VERSION_MIN_FLAG}}'
      CGO_LDFLAGS: '-isysroot {{.SDK_PATH}} -target {{.IOS_TARGET}}'

  ensure-simulator:
    internal: true
    summary: Ensure iOS Simulator is running and booted
    silent: true
    cmds:
      - |
        if ! xcrun simctl list devices booted | grep -q "Booted"; then
          echo "Starting iOS Simulator..."
          # Get first available iPhone device
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -o "[A-F0-9-]\{36\}" || true)
          if [ -z "$DEVICE_ID" ]; then
            echo "No iPhone simulator found. Creating one..."
            RUNTIME=$(xcrun simctl list runtimes | grep iOS | tail -1 | awk '{print $NF}')
            # Use the newest iPhone device type this Xcode knows about
            DEVICE_TYPE=$(xcrun simctl list devicetypes | grep -oE "iPhone [0-9][^(]*" | tail -1 | xargs)
            DEVICE_ID=$(xcrun simctl create "Wails iPhone" "${DEVICE_TYPE:-iPhone 15}" "$RUNTIME")
          fi
          # Boot the device
          echo "Booting device $DEVICE_ID..."
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          # Open Simulator app
          open -a Simulator
          # Wait for boot (max 30 seconds)
          for i in {1..30}; do
            if xcrun simctl list devices booted | grep -q "Booted"; then
              echo "Simulator booted successfully"
              break
            fi
            sleep 1
          done
          # Final check
          if ! xcrun simctl list devices booted | grep -q "Booted"; then
            echo "Failed to boot simulator after 30 seconds"
            exit 1
          fi
        fi
    preconditions:
      - sh: command -v xcrun
        msg: "xcrun not found. Please run 'wails3 task ios:install:deps' to install iOS development dependencies"

  generate:ios:overlay:
    internal: true
    summary: Generate Go build overlay and iOS shim
    sources:
      - build/config.yml
    generates:
      - build/ios/xcode/overlay.json
      - build/ios/xcode/gen/main_ios.gen.go
    cmds:
      - wails3 ios overlay:gen -out build/ios/xcode/overlay.json -config build/config.yml

  generate:ios:xcode:
    internal: true
    summary: Generate iOS Xcode project structure and assets
    deps:
      - task: mediadl:fetch
    env:
      # Pass metadata as environment variables so unusual command-line values
      # cannot escape the shell quoting before the Go patcher validates them.
      TDRIVE_IOS_MIN_VERSION: '{{.MIN_IOS_VERSION}}'
      TDRIVE_IOS_MARKETING_VERSION: '{{.APP_VERSION}}'
      TDRIVE_IOS_BUILD_NUMBER: '{{.IOS_BUILD_NUMBER}}'
    sources:
      - build/config.yml
      - build/appicon.png
      - build/ios/Info.plist
      - build/ios/main.m
      - build/ios/TDrivePhotoBridge.inc
      - build/ios/TDriveMediaDl.inc
      - build/ios/scripts/build_xcode_archive.sh
      - build/ios/scripts/patch_xcode_project.go
    generates:
      - build/ios/xcode/main/main.m
      - build/ios/xcode/main/TDrivePhotoBridge.inc
      - build/ios/xcode/main/TDriveMediaDl.inc
      - build/ios/xcode/main/Assets.xcassets/**/*
      - build/ios/xcode/main.xcodeproj/project.pbxproj
    cmds:
      - wails3 ios xcode:gen -outdir build/ios/xcode -config build/config.yml
      # xcode:gen rewrites main.m from its own template, and Xcode compiles that
      # copy rather than the repo's. Anything this app needs at launch lives in
      # build/ios/main.m, so put it back or a build driven from Xcode quietly
      # ships without it while a build driven from here has it.
      - cp build/ios/main.m build/ios/xcode/main/main.m
      - cp build/ios/TDrivePhotoBridge.inc build/ios/xcode/main/TDrivePhotoBridge.inc
      - cp build/ios/TDriveMediaDl.inc build/ios/xcode/main/TDriveMediaDl.inc
      # Go's c-archive carries ImageIO calls but Xcode links the final binary.
      # The Wails template only includes its own frameworks; add ours to both
      # generated configurations every time the project is regenerated.
      - |
        perl -0pi -e 's/"-ObjC",/"-ObjC", "-framework", "Python", "-Wl,-rpath,\@executable_path\/Frameworks", "-framework", "CoreGraphics", "-framework", "ImageIO", "-framework", "Photos", "-framework", "PhotosUI", "-framework", "Network", "-framework", "UniformTypeIdentifiers",/g' build/ios/xcode/main.xcodeproj/project.pbxproj
      # Make the generated project archive-safe. The patcher validates every
      # Wails template anchor before changing it, so upstream template drift
      # fails here instead of producing a subtly broken TestFlight archive.
      - |
        go run build/ios/scripts/patch_xcode_project.go \
          -project build/ios/xcode/main.xcodeproj/project.pbxproj \
          -minimum-version "$TDRIVE_IOS_MIN_VERSION" \
          -marketing-version "$TDRIVE_IOS_MARKETING_VERSION" \
          -build-number "$TDRIVE_IOS_BUILD_NUMBER"
      # Same trap for Info.plist: the generated one carries none of the keys
      # this app declares, and UIFileSharingEnabled is the difference between
      # a download the Files app lists and one nobody can reach. Keep the
      # bundle id the generator chose, so only the declarations are copied.
      - |
        for key in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
          value=$(/usr/libexec/PlistBuddy -c "Print :$key" build/ios/Info.plist)
          /usr/libexec/PlistBuddy -c "Set :$key $value" build/ios/xcode/main/Info.plist 2>/dev/null ||
            /usr/libexec/PlistBuddy -c "Add :$key bool $value" build/ios/xcode/main/Info.plist
        done
        for key in NSPhotoLibraryUsageDescription NSFaceIDUsageDescription; do
          description=$(/usr/libexec/PlistBuddy -c "Print :$key" build/ios/Info.plist)
          /usr/libexec/PlistBuddy -c "Set :$key $description" build/ios/xcode/main/Info.plist 2>/dev/null ||
            /usr/libexec/PlistBuddy -c "Add :$key string $description" build/ios/xcode/main/Info.plist
        done
        /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable $(EXECUTABLE_NAME)' build/ios/xcode/main/Info.plist
        /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString $(MARKETING_VERSION)' build/ios/xcode/main/Info.plist
        /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion $(CURRENT_PROJECT_VERSION)' build/ios/xcode/main/Info.plist
        # Intentionally leave ITSAppUsesNonExemptEncryption unset. TDrive
        # implements file encryption, so the account holder must answer App
        # Store Connect's export questionnaire and attach any required
        # declaration before committing a legal classification to the bundle.

  run:
    summary: Run the application in iOS Simulator
    deps:
      - task: ensure-simulator
      - task: compile:ios
    cmds:
      - rm -rf "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - cp "{{.BIN_DIR}}/{{.APP_NAME | lower}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/{{.APP_NAME | lower}}"
      - cp build/ios/Info.dev.plist "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Info.plist"
      - |
        # Compile asset catalog and embed icons for dev bundle.
        #
        # actool refuses to run when every installed simulator runtime is older
        # than the SDK ("No simulator runtime version from [...] available to
        # use with iphonesimulator SDK version ..."), which happens whenever
        # Xcode is newer than the runtime you actually have. The icon is
        # cosmetic on a dev build, so a failure here must not stop the app from
        # launching; the release path in create:app:bundle still treats it as
        # fatal, because a shipped bundle needs its icon.
        APP_BUNDLE="{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
        AC_IN="build/ios/xcode/main/Assets.xcassets"
        if [ -d "$AC_IN" ]; then
          TMP_AC=$(mktemp -d)
          xcrun actool \
            --compile "$TMP_AC" \
            --app-icon AppIcon \
            --platform iphonesimulator \
            --minimum-deployment-target {{.MIN_IOS_VERSION}} \
            --product-type com.apple.product-type.application \
            --target-device iphone \
            --target-device ipad \
            --output-partial-info-plist "$APP_BUNDLE/assetcatalog_generated_info.plist" \
            "$AC_IN" >/dev/null 2>&1 || echo "note: app icon skipped (actool needs a simulator runtime matching the SDK)"
          if [ -f "$TMP_AC/Assets.car" ]; then
            cp -f "$TMP_AC/Assets.car" "$APP_BUNDLE/Assets.car"
          fi
          rm -rf "$TMP_AC"
          if [ -f "$APP_BUNDLE/assetcatalog_generated_info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Merge $APP_BUNDLE/assetcatalog_generated_info.plist" "$APP_BUNDLE/Info.plist" || true
          fi
        fi
      - task: mediadl:stage
        vars:
          MEDIADL_APP: '{{.BIN_DIR}}/{{.APP_NAME}}.dev.app'
      - |
        # The dev bundle id comes from build/ios/Info.dev.plist (derived from
        # build/config.yml), so read it from the built bundle rather than
        # assuming a com.wails.* prefix.
        DEV_APP="{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
        BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$DEV_APP/Info.plist")
        xcrun simctl terminate booted "$BUNDLE_ID" 2>/dev/null || true
        # Keep the data container across runs so a dev build does not cost a
        # fresh Telegram sign-in every time; IOS_CLEAN=1 wipes it on purpose.
        if [ "${IOS_CLEAN:-0}" = "1" ]; then
          echo "IOS_CLEAN=1: wiping the app container (session, config, database)"
          xcrun simctl uninstall booted "$BUNDLE_ID" 2>/dev/null || true
        fi
        xcrun simctl install booted "$DEV_APP"
        xcrun simctl launch booted "$BUNDLE_ID"

  xcode:
    summary: Open the generated Xcode project for this app
    cmds:
      - task: generate:ios:xcode
      - open build/ios/xcode/main.xcodeproj

  logs:
    summary: Stream iOS Simulator logs filtered to this app
    cmds:
      - |
        xcrun simctl spawn booted log stream \
          --level debug \
          --style compact \
          --predicate 'senderImagePath CONTAINS[c] "{{.APP_NAME | lower}}.app/" OR composedMessage CONTAINS[c] "{{.APP_NAME | lower}}" OR eventMessage CONTAINS[c] "{{.APP_NAME | lower}}" OR process == "{{.APP_NAME | lower}}" OR category CONTAINS[c] "{{.APP_NAME | lower}}"'

  logs:dev:
    summary: Stream logs for the dev bundle (used by `task ios:run`)
    cmds:
      - |
        xcrun simctl spawn booted log stream \
          --level debug \
          --style compact \
          --predicate 'senderImagePath CONTAINS[c] ".dev.app/" OR subsystem == "com.wails.{{.APP_NAME | lower}}.dev" OR process == "{{.APP_NAME | lower}}"'

  logs:wide:
    summary: Wide log stream to help discover the exact process/bundle identifiers
    cmds:
      - |
        xcrun simctl spawn booted log stream \
          --level debug \
          --style compact \
          --predicate 'senderImagePath CONTAINS[c] ".app/"'
